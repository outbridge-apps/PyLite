name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the OIDC token nuget.org trades for a short-lived key

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The project file owns the version; a tag that disagrees with it is a mistake, not an input.
      - name: Check the tag against the project version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = (Select-String -Path src/PyLite/PyLite.csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          $tag = '${{ github.event.release.tag_name }}'
          if ("v$v" -ne $tag)
          {
              throw "release $tag does not match project version $v"
          }

      - name: Pack
        run: dotnet pack PyLite.sln -c Release -p:ContinuousIntegrationBuild=true

      - name: Trade the workflow identity for a short-lived key
        uses: NuGet/login@v1
        id: login
        with:
          user: OlekSt

      - name: Push to nuget.org
        run: dotnet nuget push src/PyLite/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
